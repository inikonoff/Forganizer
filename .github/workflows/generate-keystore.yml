name: Generate release keystore

# Manual, one-time job: creates a release keystore, stores the four signing secrets in this
# repository and uploads an ENCRYPTED backup. Passwords are never printed or uploaded in clear.
#
# Before the first run create two repository secrets (see README, "Подпись APK"):
#   SECRETS_PAT        fine-grained token for this repo with "Secrets: Read and write"
#   BACKUP_PASSPHRASE  a passphrase of your choice (12+ chars) that protects the backup

on:
  workflow_dispatch:
    inputs:
      alias:
        description: "Key alias"
        default: "forganizer"
        required: true
      cert_name:
        description: "Certificate name (CN)"
        default: "Forganizer"
        required: true
      overwrite:
        description: "Replace existing signing secrets (DANGEROUS: already published apps can no longer be updated with the old key)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: generate-keystore
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.SECRETS_PAT }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      REPO: ${{ github.repository }}
      OVERWRITE: ${{ inputs.overwrite }}
      KEY_ALIAS_INPUT: ${{ inputs.alias }}
      CERT_CN: ${{ inputs.cert_name }}
      WORK: ${{ runner.temp }}/keystore
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check prerequisites
        run: |
          missing=""
          [ -z "$GH_TOKEN" ] && missing="$missing SECRETS_PAT"
          [ -z "$BACKUP_PASSPHRASE" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them in Settings > Secrets and variables > Actions, then run again."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 12 ]; then
            echo "::error::BACKUP_PASSPHRASE is too short (need 12+ characters)."
            exit 1
          fi

      - name: Refuse to overwrite existing signing secrets
        run: |
          if ! existing="$(gh secret list --repo "$REPO" --json name --jq '.[].name' 2>&1)"; then
            echo "::error::SECRETS_PAT cannot read secrets of $REPO. It needs repository access to $REPO with 'Secrets: Read and write'."
            exit 1
          fi
          found="$(echo "$existing" | grep -xE 'KEYSTORE_BASE64|KEYSTORE_PASSWORD|KEY_ALIAS|KEY_PASSWORD' || true)"
          if [ -n "$found" ] && [ "$OVERWRITE" != "true" ]; then
            echo "::error::Signing secrets already exist ($(echo $found | tr '\n' ' ')). Replacing them would make it impossible to update apps signed with the old key. Run again with 'overwrite' enabled only if you are sure."
            exit 1
          fi

      - name: Generate keystore and encrypted backup
        run: .github/scripts/generate-keystore.sh "$WORK"

      - name: Store signing secrets
        run: |
          store_password="$(cat "$WORK/store_password.txt")"
          echo "::add-mask::$store_password"
          base64 -w0 "$WORK/release.jks" | gh secret set KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$store_password" | gh secret set KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$store_password" | gh secret set KEY_PASSWORD --repo "$REPO"
          cat "$WORK/alias.txt" | gh secret set KEY_ALIAS --repo "$REPO"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: forganizer-keystore-backup
          path: ${{ env.WORK }}/backup/forganizer-keystore-backup.enc
          retention-days: 7
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Keystore created"
            echo
            echo "The secrets \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\`, \`KEY_PASSWORD\` are set."
            echo "The next run of **Android APK** signs the release APKs with this key."
            echo
            echo "**Download the backup now** (artifact \`forganizer-keystore-backup\`, kept 7 days) and store it together with your \`BACKUP_PASSPHRASE\`."
            echo "Secrets cannot be read back from GitHub: without the backup a lost key cannot be recovered."
            echo
            echo "Certificate:"
            echo '```'
            cat "$WORK/fingerprint.txt"
            echo '```'
            echo
            echo "Decrypt on a computer:"
            echo '```'
            echo "openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in forganizer-keystore-backup.enc -out bundle.tar"
            echo "tar -xf bundle.tar   # release.jks and credentials.txt"
            echo '```'
            echo
            echo "After that delete \`SECRETS_PAT\` (and revoke the token) if you do not need it any more."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary files
        if: always()
        run: rm -rf "$WORK"
