name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
    paths-ignore: ["server/**", "docs/**", "*.md", "render.yaml"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the APKs to (e.g. 0.2.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      SERVER_URL: ${{ vars.SERVER_URL }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version name
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          if [ -n "${RELEASE_TAG}" ]; then tag="${RELEASE_TAG}"; fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"
          if [ -n "${tag}" ]; then
            echo "VERSION_NAME=${tag#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Decode release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests (core)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs (full + play)
        run: ./gradlew --no-daemon assembleFullRelease assemblePlayRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*.apk "dist/forganizer-full-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/play/release/*.apk "dist/forganizer-play-${VERSION_NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: forganizer-apk-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

      - name: Attach APKs to the GitHub release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
